<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErrorLens — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0F172A; --bg-card: #1E293B; --primary: #4F46E5;
      --primary-light: #818CF8; --text: #F8FAFC; --subtext: #94A3B8;
      --border: rgba(255,255,255,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--primary-light); }
    p {
      color: var(--subtext);
      font-size: 1rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.7;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 520px;
      width: 100%;
    }
    .stat-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 120px;
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.2);
      border-radius: 10px;
      padding: 16px;
    }
    .stat-value {
      font-family: 'Poppins', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-light);
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-top: 2px;
    }
    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover { border-color: var(--primary-light); color: var(--text); }
    .animation { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="badge animation" style="animation-delay:0s">✓ Authentication Successful</div>
  <h1 class="animation" style="animation-delay:0.1s">Welcome to <span>ErrorLens</span></h1>
  <p class="animation" style="animation-delay:0.2s">
    You've successfully logged in. This is a placeholder dashboard.
    Connect your backend to populate real data here.
  </p>

  <div class="card animation" style="animation-delay:0.3s">
    <div class="stat-row">
      <div class="stat">
        <div class="stat-value">0</div>
        <div class="stat-label">Active Errors</div>
      </div>
      <div class="stat">
        <div class="stat-value">—</div>
        <div class="stat-label">Workflow Runs</div>
      </div>
      <div class="stat">
        <div class="stat-value">99.9%</div>
        <div class="stat-label">Uptime</div>
      </div>
    </div>
  </div>

  <a href="login.html" class="back-btn animation" style="animation-delay:0.4s">← Back to Login</a>
</body>
</html>
<script src="dashboard.js"></script>

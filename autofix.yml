# .github/workflows/autofix.yml
# Triggers on failed CI runs → sends logs to the AutoFix backend

name: AutoFix Pipeline

on:
  workflow_run:
    workflows: ["CI"]          # Replace with your CI workflow name
    types: [completed]

jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CI logs
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const logs = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id
            });
            // Write raw log bytes to disk
            require('fs').writeFileSync('ci_logs.zip', Buffer.from(logs.data));

      - name: Extract log text
        run: |
          unzip -o ci_logs.zip -d ci_logs/
          # Concatenate all log files into one
          find ci_logs -name "*.txt" | xargs cat > error_log.txt
          echo "--- Log preview ---"
          head -60 error_log.txt

      - name: Send to AutoFix backend
        env:
          AUTOFIX_URL: ${{ secrets.AUTOFIX_URL }}   # e.g. https://your-server.com
          AUTOFIX_KEY: ${{ secrets.AUTOFIX_KEY }}   # Optional bearer token
        run: |
          LOG=$(cat error_log.txt)
          curl -s -X POST "$AUTOFIX_URL/api/generate-fix" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AUTOFIX_KEY" \
            -d "$(jq -n --arg log "$LOG" '{"errorLog": $log}')" \
            | tee fix_result.json

      - name: Apply fix if high confidence
        env:
          AUTOFIX_URL: ${{ secrets.AUTOFIX_URL }}
        run: |
          CONFIDENCE=$(jq -r '.fix.confidence' fix_result.json)
          FILE=$(jq -r '.fix.filePath // empty' fix_result.json)

          echo "Confidence: $CONFIDENCE%"

          if [ "$CONFIDENCE" -ge 85 ] && [ -n "$FILE" ]; then
            echo "High confidence — applying fix automatically"
            curl -s -X POST "$AUTOFIX_URL/api/apply-fix" \
              -H "Content-Type: application/json" \
              -d "$(jq '{filePath: .fix.filePath, oldCode: .fix.before, newCode: .fix.after}' fix_result.json)"
          else
            echo "Confidence below threshold or no file path — skipping auto-apply"
            echo "Review the fix at $AUTOFIX_URL"
          fi

      - name: Upload fix result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: autofix-result
          path: fix_result.json
